; Uzumaru firmware - PlatformIO project
; https://docs.platformio.org/page/projectconf.html
;
; Versions are pinned to the last known-good build (April 2025). Unpinned,
; PlatformIO pulls the newest espressif32 platform (Arduino-ESP32 3.x),
; FastLED and TaskScheduler, and the firmware no longer compiles.
; Upgrade deliberately, one dependency at a time.

[common_env_data]
lib_deps =
    fastled/FastLED@3.9.15
    arkhipenko/TaskScheduler@3.8.5
    https://github.com/Fattoresaimon/ArduinoDuPPaLib.git#ba86fe918f2906e64399f8f414f0bb433a502234

[env]
extra_scripts = merge-bin.py

; M5Stack Atom Matrix (ESP32-PICO-D4)
[env:m5stack_atommatrix]
platform = espressif32@6.10.0
board = pico32
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps = ${common_env_data.lib_deps}
