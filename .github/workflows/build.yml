name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays: catch upstream library releases that break the build

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio/packages # toolchains only; libraries are re-resolved below
          key: pio-packages-${{ runner.os }}-${{ github.run_id }}
          restore-keys: pio-packages-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Update platform and libraries to the latest allowed versions
        run: pio pkg install && pio pkg update
      - name: Build firmware (Atom S3 Lite and Atom Lite)
        run: pio run -e m5stack_atomlite_s3 -e m5stack_atomlite
      - name: Build with beatsense enabled
        run: PLATFORMIO_BUILD_FLAGS=-DUZUMARU_BEATSENSE pio run -e m5stack_atomlite_s3
      - name: Geometry table is up to date
        run: python3 tools/gen_geometry.py > /tmp/geometry.h && diff -u src/geometry.h /tmp/geometry.h
      - name: Render every pattern on the desktop
        run: |
          tools/preview/build.sh
          for p in $(.pio/preview/preview --list | grep -v '#'); do
            .pio/preview/preview "$p" 2 7 12 10 > /dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/*/firmware.bin
            .pio/build/*/firmware.elf
